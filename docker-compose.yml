services:
  osrm-download:
    image: curlimages/curl:8.11.1
    user: "root"
    volumes:
      - osrm-data:/data
    command:
      - sh
      - -c
      - |
        set -eu
        TARGET=/data/rio-grande-do-sul-latest.osm.pbf
        URL=https://download.openstreetmap.fr/extracts/south-america/brazil/south/rio-grande-do-sul-latest.osm.pbf
        if [ -f "$$TARGET" ]; then
          echo "PBF already present: $$TARGET"
          exit 0
        fi
        echo "Downloading Rio Grande do Sul OSM extract (~158MB)..."
        curl -fL --retry 5 --retry-all-errors --retry-delay 5 -o "$$TARGET" "$$URL"
        echo "Download complete"

  osrm-prepare:
    image: osrm/osrm-backend:latest
    depends_on:
      osrm-download:
        condition: service_completed_successfully
    volumes:
      - osrm-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        PBF=/data/rio-grande-do-sul-latest.osm.pbf
        GRAPH=/data/rio-grande-do-sul-latest.osrm
        PROFILE_DIR=/data/profiles
        PROFILE=$$PROFILE_DIR/motorcycle.lua
        
        if [ -f /data/rio-grande-do-sul-latest.osrm.partition ]; then
          echo "OSRM graph already prepared"
          exit 0
        fi
        
        echo "Criando um perfil de moto confiavel a partir do oficial..."
        mkdir -p $$PROFILE_DIR
        # Copia todos os perfis e bibliotecas nativas do OSRM para o volume
        cp -r /opt/* $$PROFILE_DIR/
        # Cria o motorcycle.lua a partir do car.lua oficial
        mv $$PROFILE_DIR/car.lua $$PROFILE
        
        echo "Extracting motorcycle graph from $$PBF"
        osrm-extract -p $$PROFILE "$$PBF"
        echo "Partitioning..."
        osrm-partition "$$GRAPH"
        echo "Customizing..."
        osrm-customize "$$GRAPH"
        echo "OSRM motorcycle graph ready"

  osrm:
    image: osrm/osrm-backend:latest
    depends_on:
      osrm-prepare:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - osrm-data:/data
    command: osrm-routed --algorithm mld --ip 0.0.0.0 --port 5000 /data/rio-grande-do-sul-latest.osrm
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      osrm:
        condition: service_started
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      OSRM_URL: http://osrm:5000
      DEFAULT_PROFILE: motorcycle

volumes:
  osrm-data:  