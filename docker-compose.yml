services:
  osrm-download:
    image: curlimages/curl:8.11.1
    user: "root"
    volumes:
      - ${OSRM_DATA_DIR}:/data
    command:
      - sh
      - -c
      - |
        set -eu
        TARGET=/data/${OSRM_EXTRACT}.osm.pbf
        URL=${OSRM_PBF_URL}
        if [ -f "$$TARGET" ]; then
          echo "PBF already present: $$TARGET"
          exit 0
        fi
        echo "Downloading OSM extract ($$URL)..."
        curl -fL --retry 5 --retry-all-errors --retry-delay 5 -o "$$TARGET" "$$URL"
        echo "Download complete"

  osrm-prepare:
    image: osrm/osrm-backend:latest
    depends_on:
      osrm-download:
        condition: service_completed_successfully
    volumes:
      - ${OSRM_DATA_DIR}:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        PBF=/data/${OSRM_EXTRACT}.osm.pbf
        GRAPH=/data/${OSRM_EXTRACT}.osrm
        PROFILE_DIR=/data/profiles
        PROFILE=$$PROFILE_DIR/motorcycle.lua

        if [ -f "$$GRAPH.partition" ]; then
          echo "OSRM graph already prepared"
          exit 0
        fi

        echo "Criando um perfil de moto confiavel a partir do oficial..."
        mkdir -p $$PROFILE_DIR
        # O compartilhamento FUSE do Docker Desktop pode nao estar pronto no
        # instante em que este container inicia; tenta a copia com retry.
        for i in 1 2 3 4 5; do
          if cp -r /opt/* $$PROFILE_DIR/; then
            break
          fi
          echo "Falha ao copiar perfis (tentativa $$i/5), aguardando 3s..."
          sleep 3
        done
        # Cria o motorcycle.lua a partir do car.lua oficial
        mv $$PROFILE_DIR/car.lua $$PROFILE

        echo "Extracting motorcycle graph from $$PBF"
        osrm-extract -p $$PROFILE "$$PBF"
        echo "Partitioning..."
        osrm-partition "$$GRAPH"
        echo "Customizing..."
        osrm-customize "$$GRAPH"
        echo "OSRM motorcycle graph ready"

  osrm:
    image: osrm/osrm-backend:latest
    depends_on:
      osrm-prepare:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ${OSRM_DATA_DIR}:/data
    command: osrm-routed --algorithm mld --ip 0.0.0.0 --port 5000 /data/${OSRM_EXTRACT}.osrm
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      osrm:
        condition: service_started
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8888"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8888
      OSRM_URL: http://osrm:5000
      DEFAULT_PROFILE: motorcycle